# THE PARALLEL CAMPAIGN -- `icassp_exact_convex`, era 06.
#
# `studies/icassp/fig2_angle_told.toml` with ONE contender substituted: the convex policy,
# solved as the box-QP it is rather than through a general cone program. Every
# other contender is byte-for-byte what the ICASSP document declares and resolves
# to the identifier its model is already filed under, so this study trains the
# convex policy alone and reuses the rest.
#
# The ICASSP campaign is not edited, re-run or superseded; where both versions
# run, its stored result is the control this one is measured against.
#
# ICASSP Figure 2, the sweep's TOLD condition: trained on the nominal plant,
# scored on the theta-rotated one, and HANDED it.
#
# Trains nothing. Every learned point is Figure 1's model, and the only thing
# that moves along the axis is which plant the world runs and which matrices
# the controller is given. `rehost = "full"` is the doctrine's second half
# (Annex 01 §2.4.1 as amended 2026-08-09): an analytic family re-synthesises
# WHOLE against the evaluation plant, a learned family keeps every offline
# artifact frozen and forms its online expressions from the given matrices.
#
# THETA = 0 IS A CHECK, NOT A DATUM. Being told the nominal matrices while
# running the nominal plant cannot change anything, so this document's first
# position must reproduce Figure 1's matched cost to the last digit. It
# carries a different MeasurementID -- `rehost` signs off its default -- so
# the agreement is a real comparison of two computations rather than a cache
# hit.
#
# THE RECURRENT BASELINE IS THE OTHER FREE CHECK. A GRU reads observations and
# nothing else, so being handed A' cannot reach it: its cell here must equal
# its cell in the blind document, angle by angle. Any difference is a defect
# in the rehost path, not a result.

id = "icassp_exact_convex/fig2_angle_told"

[problem]
path = "../icassp/icassp_n4m2_N100_u0p1_s0.npz"

[compute]
backend = "torch"
device = "cpu"
precision = "float64"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 100

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]
rehost = "full"

[evaluation.protocol]
_build = "protocol"
n_batches = 8

[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# The analytic PGD's per-plant construction literal, one per rotated plant.
# Under `full` the family re-synthesises whole, so its step must be the plant
# it is handed -- and rotating A without B moves B'PB and therefore L. Each
# literal is that plant's exact 1/L halved (the 2026-08-09 half-step law),
# authored by tools/report_pgd_step.py and never computed at load, because
# `step_size_init` participates in identity at ONE-ULP granularity and five
# LAPACK paths disagree by one ULP on this plant.
#
# The nominal plant needs no entry: the contender already declares its step.

[[evaluation.rehost_overrides]]
contender = "standard_pgd"
problem = "../icassp/icassp_n4m2_N100_u0p1_s0_rotA5.npz"

[evaluation.rehost_overrides.config]
step_size_init = 0.028211032863622407

[[evaluation.rehost_overrides]]
contender = "standard_pgd"
problem = "../icassp/icassp_n4m2_N100_u0p1_s0_rotA10.npz"

[evaluation.rehost_overrides.config]
step_size_init = 0.027945557054815887

[[evaluation.rehost_overrides]]
contender = "standard_pgd"
problem = "../icassp/icassp_n4m2_N100_u0p1_s0_rotA20.npz"

[evaluation.rehost_overrides.config]
step_size_init = 0.027360343720864454

[[evaluation.rehost_overrides]]
contender = "standard_pgd"
problem = "../icassp/icassp_n4m2_N100_u0p1_s0_rotA30.npz"

[evaluation.rehost_overrides.config]
step_size_init = 0.026587521804457333

[[evaluation.rehost_overrides]]
contender = "standard_pgd"
problem = "../icassp/icassp_n4m2_N100_u0p1_s0_rotA45.npz"

[evaluation.rehost_overrides.config]
step_size_init = 0.02519510801632263

# -- the contenders --------------------------------------------------------
#
# Figure 1's cast at J = 3, bit for bit: one edited field would retrain rather
# than reuse, and this document exists precisely to train nothing.

[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

[[contenders]]
label = "standard_pgd"
display = 'PGD'
family = "unfolded_fixed"
role = "baseline"

[contenders.config]
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[[contenders]]
label = "unfolded_alpha"
display = 'UF-$\alpha$'
family = "unfolded"

[contenders.config]
kind = "learned_step_size"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "unfolded_alpha_p"
display = 'UF-$\alpha$P'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_matrix"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "unfolded_alpha_pj"
display = 'UF-$\alpha$P$^{(j)}$'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_per_iteration_matrix"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 64
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 100

[[contenders]]
label = "cocp_exact"
display = 'COCP (exact)'
family = "cocp_exact"

[contenders.config]
use_linear_term = false

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.1
epochs = 100

# -- what varies -----------------------------------------------------------
#
# One axis: which plant the world runs. No training world is declared, so
# every learned point is the nominally-trained model at every angle.

[[sweep]]
path = "evaluation.problem"
values = [
    "../icassp/icassp_n4m2_N100_u0p1_s0.npz",
    "../icassp/icassp_n4m2_N100_u0p1_s0_rotA5.npz",
    "../icassp/icassp_n4m2_N100_u0p1_s0_rotA10.npz",
    "../icassp/icassp_n4m2_N100_u0p1_s0_rotA20.npz",
    "../icassp/icassp_n4m2_N100_u0p1_s0_rotA30.npz",
    "../icassp/icassp_n4m2_N100_u0p1_s0_rotA45.npz",
]
labels = ["0", "5", "10", "20", "30", "45"]

# -- what must hold --------------------------------------------------------

[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

[[gates]]
kind = "step_is_inverse_lipschitz"
contenders = ["standard_pgd", "unfolded_alpha", "unfolded_alpha_p", "unfolded_alpha_pj"]
fraction = 0.5

# -- what is computed from the results -------------------------------------

[[analyses]]
id = "cost_by_angle_told_exact"
kind = "cost_by_category"
axis = "evaluation.problem"
aggregate = "mean"

# -- per-study tier overlay ------------------------------------------------

[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 100
"contenders.neural.config.plan.epochs" = 200
"contenders.unfolded_alpha.config.plan.epochs" = 200
"contenders.unfolded_alpha_p.config.plan.epochs" = 200
"contenders.unfolded_alpha_pj.config.plan.epochs" = 200

[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 100
"contenders.neural.config.plan.epochs" = 200
"contenders.unfolded_alpha.config.plan.epochs" = 200
"contenders.unfolded_alpha_p.config.plan.epochs" = 200
"contenders.unfolded_alpha_pj.config.plan.epochs" = 200

[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
