# ICASSP -- the recurrent baseline's learning rate AT n = 100, because at
# n = 100 the incumbent rate diverges at every width.
#
# WHAT FORCED THIS DOCUMENT. The width ablation on this plant
# (`gru_hidden_ablation_n100.toml`, 30 trainings, 2026-08-11 08:06-08:31) came
# back reading 883, 807, 738, 735 at widths 64/128/256/512 against
# truncated-Riccati's 64.166 -- the baseline eleven times WORSE than clipping
# the unconstrained optimum, at every capacity it was given. A width sweep
# whose worst and best points are both an order of magnitude past the trivial
# baseline is not measuring capacity, and the stored training curves say what
# it was measuring instead: in 19 of 20 arms the loss reaches its minimum at
# epoch 1-5 -- the twentieth at epoch 22 -- and is then 1.1x to 4.2x WORSE by
# epoch 100. That is an optimiser stepping past its basin, and it is the same
# signature the n = 4 rate ablation saw above 0.02 (0.03 broke one seed, 0.05
# diverged outright). The per-arm minima were re-read from `training.parquet`
# labelled by each model's stored spec rather than by write order, after that
# shortcut mis-attributed this probe's own low-rate arms to the width sweep.
#
# THE RATE WAS TUNED ON A 4-DIMENSIONAL STATE and applied to a 100-dimensional
# one. That is exactly the transfer the width ablation existed to question,
# asked of the wrong hyper-parameter: the campaign re-ablated the WIDTH at
# n = 100 and carried the RATE over unexamined.
#
# THE RATES: 0.0003 to 0.2, half a decade apart, spanning nearly three decades.
# The first five -- 0.0003, 0.001, 0.003, 0.01, 0.02 -- ran on 2026-08-11 and
# put the incumbent at the top of the range as the arm under defence rather
# than the middle, because every stored curve said the answer was below it and
# a sweep should be able to say how far below. It was: 296.32 / 238.40 / 269.54
# / 484.11 / 883.49, with the across-seed spread rising 7.35 -> 8.75 -> 82.63
# -> 197.25 -> 377.80, so the minimum sits at 0.001 and the incumbent is the
# worst point on the curve.
#
# THE UPPER THREE -- 0.05, 0.1, 0.2 -- are the author's, and they extend the
# axis ABOVE the incumbent on purpose. The measured curve predicts all three
# diverge, which is exactly why they are worth the 20 minutes: a rate ablation
# that stops at the incumbent leaves a reader to assume the far side, while one
# that brackets the minimum on both sides has bounded it. `0.05 diverged
# outright` is on record at n = 4; whether that transfers to n = 100 is a
# measurement this document can make and currently does not.
#
# The five stored arms carry by identity -- same plant, tier, substrate and
# seeds -- so extending the axis re-fits nothing already fitted. The earlier
# five-rate study remains readable at its own StudyID; sweep values are signed,
# so this is a new study rather than an edit to that one's results.
#
# THE WIDTH IS THE INCUMBENT 64, and the ordering is deliberate: rate first at
# a fixed width, then the width re-ablated at the winning rate. The n = 100
# width sweep already run cannot be read for capacity while the optimiser is
# diverging under it, and it will be re-run -- on this card a 100-epoch GRU
# training at n = 100 costs 65-90 s, so the chain costs about an hour in
# total, which is what makes doing it in the right order affordable.
#
# READ THE CURVES, NOT ONLY THE TABLE. The acceptance question here is not
# only which rate wins but whether the winner's loss is still DESCENDING at
# epoch 100 -- at 65 s a training, a rate that needs 200 or 400 epochs is
# affordable on this plant in a way it never was on the CPU, and the pinned
# 100 is the campaign's instance rather than a law.

id = "icassp/gru_lr_probe_n100"

# D19: the frozen plant, committed beside the study -- the width ablation's
# and Figure 3's. Comparing this probe with either requires the plant to be
# identical rather than merely similar.
[problem]
path = "icassp_n100m30_N100_u0p1_s0.npz"

# CUDA/float32, the substrate the n = 100 figures were moved to and measured
# before adoption: x43 on this family against the CPU, and float32 moves the
# analytic contenders by 1.2e-4 to 2.4e-4 relative. Precision is CONTENT, so
# it is declared here and signs every ModelID this document derives.
[compute]
backend = "torch"
device = "cuda"
precision = "float32"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.02
epochs = 100

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------

# The GRU under ablation, at the incumbent width. `label` stays "neural" --
# `NeuralRecipe`'s own default and the key the project-wide colour registry
# knows; an unregistered label falls through to a spare palette slot.
#
# `learning_rate` is declared here and REPLACED at every point by the sweep.
# The value written is the incumbent, so a reader who ignores the sweep sees
# the rate under defence rather than an arbitrary endpoint.
[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 64
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.02
epochs = 100

# The number the baseline has to beat to be worth its parameters, at every
# rate -- and on this plant the number every width failed to reach by a factor
# of eleven. Rate-invariant, so it draws as one level.
[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

# The unconstrained floor: not a competitor, and `role = "reference"` gives it
# §B.3.1's reserved encoding rather than a palette slot.
[[contenders]]
label = "riccati_unconstrained"
display = 'Riccati (unconstrained)'
family = "riccati"
role = "reference"

[contenders.config]
horizon = 100

# -- what varies -----------------------------------------------------------

# `applies_to` is load-bearing: without it the two rate-invariant contenders
# would each be emitted once per rate, for five identical results apiece.
[[sweep]]
path = "contenders.*.config.plan.optimizer.learning_rate"
values = [0.0003, 0.001, 0.003, 0.01, 0.02, 0.05, 0.1, 0.2]
applies_to = ["neural"]

# -- what must hold --------------------------------------------------------

[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

# -- what is computed from the results -------------------------------------

[[analyses]]
id = "gru_cost_by_lr_n100_full"
kind = "cost_vs_axis"
axis = "contenders.*.config.plan.optimizer.learning_rate"
aggregate = "mean"

[[figures]]
id = "fig_gru_lr_n100_full"
kind = "axis_scaling"
source = "gru_cost_by_lr_n100_full"
xscale = "log"
xlabel = "Adam learning rate"
ylabel = "mean cost"
title = "The recurrent baseline against its learning rate at n = 100"

[figures.table]
columns = [
    "contender",
    "axis_value",
    "aggregate",
    "across_seed_spread",
    "n_seeds",
    "per_seed_aggregate",
]
caption = "Mean cost by Adam learning rate over three decades, GRU with 64 hidden units at n = 100."

[figures.table.precision]
default = 4
n_seeds = 0

# -- per-study tier overlay ------------------------------------------------

# THE PIN, bound to the tier NAME. `[publication]` writes `epochs = 200` while
# this campaign's declared instance is 100; an unpinned run would produce a
# GRU that cannot be compared with either the width ablation or Figure 3.
[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 100

[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 100

[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
