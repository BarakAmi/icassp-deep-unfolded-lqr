# ICASSP -- is the recurrent baseline WIDE ENOUGH at n = 100? The width,
# re-ablated on the large instance.
#
# THE QUESTION is the author's, and it is a fairness question: `hidden_dim`
# was chosen at n = 4, m = 2, where 64 units met a 4-dimensional state. At
# n = 100, m = 30 the state is 25x larger and the control 15x, and a baseline
# starved of capacity at the scale the paper argues about would be a straw
# man -- exactly what this campaign has been removing one family at a time.
#
# THE SUBSTRATE IS CUDA/float32, AND THAT IS MEASURED RATHER THAN PREFERRED.
# On CPU/float64 a width-512 arm costs 2.2 h per training and peaks at
# 41.1 GB of the host's 45; on this card the same arm costs about 1.4 s per
# epoch at 16.1 GB of VRAM -- a 43x speedup that turns an infeasible sweep
# into a 35-minute one. The precision trade was measured before it was taken:
# on this plant, float32 moves the ANALYTIC contenders (whose whole content
# is a numerical solve and which, unlike a learned model, cannot adapt to the
# precision they run in) by 1.2e-4 to 2.4e-4 relative -- two to three orders
# of magnitude below any effect this figure discusses. Precision is CONTENT
# and not effort, so it lives in this document rather than in a tier: the
# grammar refuses `compute.precision` as an override, which is why the
# substrate is visible in every ModelID this study derives.
#
# THE CEILING IS 512 AND IT IS THE CARD'S, not a choice. Width 1024 at this
# batch extrapolates past the 24 GB the card has; measured, batch 16384 at
# width 512 already asks for 32.2 GB and CUDA-on-WSL answers by spilling to
# host memory, which costs 30x (1.42 -> 42.28 s per epoch). A ceiling that
# was measured is reported as one; the alternative is a sweep that appears to
# have chosen 512 on merit.
#
# FIVE SEEDS, because that is what this ablation's n = 4 twin established as
# necessary: below 64 units there the fit is BIMODAL, and a single seed
# reports whichever mode it landed in.

#
# The findings document asks for the recurrent baseline's size to be "chosen
# after a simple ablation over several hidden-layer values", and the author's
# reading is the HIDDEN DIMENSION: 16, 32, 64, 128, 256 -- five widths, log
# base 2. The campaign plan's §5.2 recorded this as an ablation over the number
# of stacked LAYERS until 2026-08-06; 8..256 is not a plausible layer count,
# and the correction removed every prerequisite that reading had implied.
#
# `hidden_dim = 8` WAS the axis's first point and was dropped on measurement.
# At the `standard` tier it attains 35.81 against 8.29-8.38 for every other
# width -- a 4.3x gap on an axis whose remaining five points sit within about
# 1 % of each other. That is not a slow point on a trend, it is a width at
# which the model fails to fit at all, and a failure point plotted beside five
# successes sets the y-axis to the failure and compresses the comparison the
# ablation exists to make. It is recorded here rather than deleted silently,
# because "8 was never tried" and "8 was tried and does not work" are
# different claims and the notebook makes the second one.
#
# It costs ZERO source lines. `hidden_dim` is already a required field of
# `NeuralRecipe`, already sweepable, and already identity-bearing: the six
# widths give six distinct ModelIDs at a fixed seed, and the StudyID moves on
# the width alone. What the layers reading would have needed -- a new field
# plumbed, a `dropout = 0.0` default and a 3-of-73-line identity re-baseline --
# is not needed at all.
#
# THIS IS ITS OWN DOCUMENT, and that is a correctness requirement rather than
# tidiness. `cost_vs_axis` groups on ONE declared axis, so a second swept axis
# lands in the same group and is reduced as though it were a training
# replicate: measured on a one-seed two-axis study, `n_seeds = 2`,
# `seeds = [0, 0]`, `across_seed_spread = 0.429494` -- a fabricated error bar,
# under a sidecar declaring it was taken over training seeds. That is now
# refused (`_require_replicates`), and the refusal is what a width axis beside
# Figure 1's depth axis would have hit.
#
# ORDERING: `hidden_dim` has no default, so Figure 1 cannot declare its GRU
# until this ablation has chosen a value. Run this first.
#
# COST: 3.1-3.4 h serial on four CPU threads at the pinned 100 epochs, of
# which `hidden_dim = 256` alone is about 64 %. Its per-epoch cost jumps x3.21
# from 128 where every other doubling costs x2.1 -- a memory-bandwidth cliff at
# ~14.5 GB of autograd graph. That band was MEASURED at six widths; dropping
# the 8 point does not move it, and this is derived from those same measured
# per-doubling ratios rather than re-measured: on a relative scale where the 8
# point costs 1, the six widths total 98.6 and the five total 97.6, so the 8
# point was 1.0 % of the campaign's cheapest block. The band stands; only
# 256's share of it rises, from 63 % to 64 %.
#
# Run the largest width FIRST or as its own invocation: `run_study` is a single
# generator over the points, and after five smaller trainings the process held
# 16 GB and 89 live threads while the 256 point ran an order of magnitude slow.

id = "icassp/gru_hidden_ablation_n100"

# D19: the frozen plant, committed beside the study. rho(A) = 0.999 to within
# 1e-12, asserted by `tools/author_icassp_problems.py` rather than declared as
# a `stability` gate -- that gate is inert, routed to "decided at parse"
# without ever looking at A (plan §2.2).
[problem]
path = "icassp_n100m30_N100_u0p1_s0.npz"

# CPU. §2.5 measured CUDA 1.63x SLOWER than the CPU at n = 4 on the unrolled
# hot loop, and `compute.*` is not a tier-scalable path, so the device is
# per-study content. The GRU is the one family that prefers CUDA, but at n = 4
# the whole study is small enough that the CPU wins on wall clock and keeps
# this document on one device.
[compute]
backend = "torch"
device = "cuda"
precision = "float32"

# Five, at `publication`. The tier writes this; it is stated here so a reader
# of the document knows what the error bars are over.
[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.02
epochs = 100

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

# The 0.5 std is written twice on purpose -- once for the trajectories the
# model is FITTED on and once for the ones it is SCORED on. They are separate
# declarations so that an evaluation knob cannot reach a model and a training
# knob cannot reach a measurement.
[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------

# The GRU under ablation. `label` stays "neural" -- `NeuralRecipe`'s own
# default and the key the project-wide colour registry knows. Renaming it to
# "gru" is not presentation-neutral: an unregistered label falls through to a
# spare palette slot, and two of the spares sit 0.017 apart in luminance, which
# is what moved the campaign's 45-placement measurement from 35 to 41.
#
# `hidden_dim` is declared here and REPLACED at every point by the sweep below.
# It has no default, so the field must be present for the document to load at
# all; the value written here is the axis's first.
[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 16
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.02
epochs = 100

# The unconstrained Riccati optimum. Not a competitor: it ignores the box
# entirely, so its cost is a floor no box-respecting policy can beat, and
# `role = "reference"` gives it §B.3.1's reserved encoding -- black, solid,
# unmarked -- rather than a palette slot. Width-invariant, so it draws as one
# level across the whole axis and gives the widths something to be read
# against.
[[contenders]]
label = "riccati_unconstrained"
display = 'Riccati (unconstrained)'
family = "riccati"
role = "reference"

[contenders.config]
horizon = 100

# The same optimum saturated onto the box at every step. Attained and
# width-invariant: the number a GRU has to beat to be worth its parameters.
[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

# -- what varies -----------------------------------------------------------

# `applies_to` is load-bearing: without it the axis would emit the two
# width-invariant contenders once per width, for six identical results each.
[[sweep]]
path = "contenders.*.config.hidden_dim"
values = [64, 128, 256, 512]
applies_to = ["neural"]

# -- what must hold --------------------------------------------------------

# The same gate Figure 1 declares. At rho = 0.999 and u_max = 0.1 the box is
# active on 77.61 % of scalar control entries along the unconstrained loop, so
# a study in which it does not bind is a study whose instance has drifted.
[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

# -- what is computed from the results -------------------------------------

# `axis` is spelled out although this document sweeps exactly one thing. The
# default is a fact about TODAY's document, and a second axis added later would
# silently move this table onto whichever was declared first -- which is now
# refused rather than pooled, but the refusal is a worse way to find out than
# the document saying what it means.
[[analyses]]
id = "cost_by_width_n100"
kind = "cost_vs_axis"
axis = "contenders.*.config.hidden_dim"
aggregate = "mean"

# `xscale = "log2"` is the axis's own spacing. On a linear axis the six widths
# put five sixths of the ink in the last gap; on a base-10 log axis the ticks
# fall where no datum is. The ticks are placed at the plotted widths, so every
# mark is a number a reader can put a name to.
#
# The figure id is unique across the store, because `mbl figure rebuild`
# refuses an id present in two studies and this campaign will have several.
[[figures]]
id = "fig_gru_width_n100"
kind = "axis_scaling"
source = "cost_by_width_n100"
xscale = "log2"
xlabel = "GRU hidden dimension"
ylabel = "mean cost"
title = "Cost against GRU hidden dimension"

# Every value the figure drew, so the width is chosen from numbers rather than
# from a curve read with a ruler. `per_seed_aggregate` and `seeds` are what
# make the error bar auditable: the acceptance question for this ablation is
# whether the width-to-width difference EXCEEDS the across-seed spread, and
# that cannot be answered from the plotted mean alone.
[figures.table]
columns = [
    "contender",
    "axis_value",
    "aggregate",
    "across_seed_spread",
    "n_seeds",
    "per_seed_aggregate",
]
# The caption says what the table IS and nothing §A.4 already emits. A first
# draft read "…, five training seeds" and the rendered table came back with
# "training seeds: 1" beside it at the `standard` tier — an author-typed count
# contradicting the emitted one, which is the exact failure §A.4 avoids by
# emitting them from the specification.
caption = "Mean cost by GRU hidden dimension."

[figures.table.precision]
default = 4
axis_value = 0
n_seeds = 0

# -- per-study tier overlay ------------------------------------------------

# THE PIN, and it is not optional. `studies/_tiers.toml`'s [publication] block
# writes `epochs = 200`, while the campaign's declared instance is 100 -- so an
# unpinned run of this document costs 6.0-6.4 h instead of 3.1-3.4 h, and every
# other block of the campaign doubles with it.
#
# `contenders.*.config.plan.epochs` is the spelling that executes. The
# catalogue says so itself: a trainable recipe carries its own plan and
# `build_engine` trains for that, while `training.plan.epochs` "changes no
# identifier and no effort". Writing the other spelling here would look like a
# pin and be inert.
# The revision tier, pinned BY NAME: an overlay binds to a tier name, and
# the first b16k launch of another document escaped exactly this pin and
# silently trained double (2026-08-09).
[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 100

[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 100

# The wiring check. `smoke` truncates a swept axis to two points and stamps
# `axis_subset = true`, which `mbl analyse` then refuses -- so a smoke run
# proves this document parses, resolves and trains, and nothing more. It can
# never become a figure.
[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
