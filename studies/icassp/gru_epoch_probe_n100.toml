# ICASSP -- WHERE DOES THE RECURRENT BASELINE STOP IMPROVING at n = 100? The
# optimisation budget, measured rather than extrapolated.
#
# WHAT FORCED THIS DOCUMENT. With the rate fixed at a value the optimiser
# survives, the width grid of 2026-08-11 (`gru_width_at_lr0p001_n100.toml` and
# its two siblings) brought the baseline from 11.0x Truncated-Riccati down to
# 1.22x -- 78.60 against 64.166 at width 256, lr 0.001. But every arm at
# 0.0003 and 0.001 is STILL DESCENDING at the pinned epoch 100: 5 of 5 seeds in
# all eight cells, with the loss still falling a median 5.8 to 11.9 over the
# final twenty epochs. The binding constraint has moved from capacity to the
# rate and now to the budget, and the campaign cannot choose a width or a rate
# under a budget that truncates every candidate.
#
# EXTRAPOLATION WAS TRIED FIRST AND IS REFUTED BY THE FLOOR. Fitting
# `a + b*t^(-c)` to epochs 40-100 of each stable arm puts the asymptote BELOW
# ZERO in three of six cells (-358.4, -50.5, -82.6) and predicts every cell
# under 55.43 at epoch 500 -- the unconstrained Riccati optimum, which no policy
# can beat in expectation. The 100-epoch window is still in the near-linear part
# of the descent and does not contain the information about where the curve
# turns over. That is why this document runs the budget instead of fitting it.
#
# THE EPOCH AXIS IS NESTED, which is what makes one long run sufficient: a
# 1000-epoch trajectory contains the 200, 500 and 800 answers as its own
# prefixes. It is read from `training.parquet` rather than from a sweep over
# epochs, and that reading is licensed by a measurement -- at lr 0.001 the five
# per-seed FINAL TRAINING LOSSES (245.5, 233.6, 227.5, 248.9, 239.1) match the
# five INDEPENDENTLY EVALUATED costs (245.27, 233.06, 226.87, 248.28, 238.52) to
# within 0.3 %, on 163840 held-out trajectories. There is no train/inference gap
# on this family at this plant, so the curve may be read as the cost curve.
#
# TWO RATES, NOT ONE, because the budget and the rate interact and the ordering
# may invert. At 100 epochs lr 0.001 beats lr 0.0003 (238.40 against 296.32 at
# width 64; 78.60 against 99.68 at width 256), yet 0.0003 descends FASTER at the
# cut-off -- a median 7.0 to 11.9 per twenty final epochs against 0.001's 5.8 to
# 8.8. A probe that carried only today's winner would bake in a choice made
# under the old budget. Whether they cross, and where, is the second thing this
# document measures.
#
# WIDTH 256 AND NOT 512: they sit inside each other's spread at both stable
# rates (78.60 +- 11.16 against 83.54 +- 16.32 at 0.001; 99.68 against 91.71 at
# 0.0003), and 256 is the cheaper of the two. The width question is re-asked
# after the budget is settled, not inside this probe -- one axis, one document.
#
# TWO SEEDS, AND THIS IS A PROBE RATHER THAN A RESULT. Two replicates cannot
# carry a publication error bar and nothing here is destined for a figure in the
# paper; what it produces is a NUMBER FOR THE NEXT DOCUMENT'S PIN. The five-seed
# grid is re-run at the budget this probe returns. Declared here rather than
# left to the tier so that a reader of the table sees an error bar over two and
# does not mistake it for the campaign's five.
#
# COST: about 12 minutes per training on this card at 1000 epochs, so four
# trainings is roughly 50 minutes. Nothing is reused -- the epoch count signs
# every ModelID, so all four points are new.

id = "icassp/gru_epoch_probe_n100"

# D19: the frozen plant, committed beside the study -- the width grid's, the
# rate probe's and Figure 3's. Comparing this probe with any of them requires
# the plant to be identical rather than merely similar.
[problem]
path = "icassp_n100m30_N100_u0p1_s0.npz"

# CUDA/float32, measured before adoption on this plant: a width-512 arm costs
# 2.2 h per training on CPU/float64 and peaks at 41.1 GB of the host's 45,
# against about 1.4 s per epoch at 16.1 GB of VRAM on this card -- x43. The
# precision trade was measured too: float32 moves the ANALYTIC contenders by
# 1.2e-4 to 2.4e-4 relative, two to three orders below any effect this probe
# discusses. Precision is CONTENT and not effort, so it lives in this document
# rather than in a tier and signs every ModelID derived from it.
[compute]
backend = "torch"
device = "cuda"
precision = "float32"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.001
epochs = 1000

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

# The 0.5 std is written twice on purpose -- once for the trajectories the
# model is FITTED on and once for the ones it is SCORED on. They are separate
# declarations so that an evaluation knob cannot reach a model and a training
# knob cannot reach a measurement.
[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------

# The GRU under probe, at the width the stable-rate grid chose. `label` stays
# "neural" -- `NeuralRecipe`'s own default and the key the project-wide colour
# registry knows; an unregistered label falls through to a spare palette slot.
#
# `learning_rate` is declared here and REPLACED at every point by the sweep.
[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 256
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.001
epochs = 1000

# The number the baseline has to beat to be worth its parameters. At 100 epochs
# the best cell of the width grid stood 1.22x above it; whether the budget alone
# closes that is this probe's first question. Rate- and budget-invariant, so it
# draws as one level.
[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

# The unconstrained floor: not a competitor, and `role = "reference"` gives it
# §B.3.1's reserved encoding rather than a palette slot. It is also the number
# that refuted the extrapolation -- every fitted @500 prediction fell below it.
[[contenders]]
label = "riccati_unconstrained"
display = 'Riccati (unconstrained)'
family = "riccati"
role = "reference"

[contenders.config]
horizon = 100

# -- what varies -----------------------------------------------------------

# `applies_to` is load-bearing: without it the two rate-invariant contenders
# would each be emitted once per rate, for two identical results apiece.
[[sweep]]
path = "contenders.*.config.plan.optimizer.learning_rate"
values = [0.0003, 0.001]
applies_to = ["neural"]

# -- what must hold --------------------------------------------------------

# The same gate the width grid and Figure 1 declare. At rho = 0.999 and
# u_max = 0.1 the box is active on 77.61 % of scalar control entries along the
# unconstrained loop, so a study in which it does not bind is a study whose
# instance has drifted.
[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

# -- what is computed from the results -------------------------------------

# The table this emits is the END POINT only; the probe's actual content is the
# stored per-epoch trajectory behind each point. `axis` is spelled out although
# this document sweeps exactly one thing, because a second axis added later
# would otherwise move the table onto whichever was declared first.
[[analyses]]
id = "gru_cost_by_lr_epoch1000_n100"
kind = "cost_vs_axis"
axis = "contenders.*.config.plan.optimizer.learning_rate"
aggregate = "mean"

# The figure id is unique across the store: `mbl figure rebuild` refuses an id
# present in two studies, and this campaign now holds six studies on this plant.
[[figures]]
id = "fig_gru_epoch_probe_n100"
kind = "axis_scaling"
source = "gru_cost_by_lr_epoch1000_n100"
xscale = "log"
xlabel = "Adam learning rate"
ylabel = "mean cost"
title = "The recurrent baseline at 1000 epochs, n = 100"

[figures.table]
columns = [
    "contender",
    "axis_value",
    "aggregate",
    "across_seed_spread",
    "n_seeds",
    "per_seed_aggregate",
]
caption = "Mean cost after 1000 epochs by Adam learning rate, GRU with 256 hidden units at n = 100. Two seeds -- a probe, not a publication error bar."

[figures.table.precision]
default = 4
n_seeds = 0

# -- per-study tier overlay ------------------------------------------------

# THE PINS, bound to the tier NAME, and BOTH are load-bearing. `[publication]`
# writes `epochs = 200` and `training.seeds = 5`; this probe is deliberately
# 1000 and 2. The epoch count is the quantity under measurement and the seed
# count is what keeps the probe at 50 minutes instead of two hours.
#
# `contenders.*.config.plan.epochs` is the spelling that EXECUTES -- a trainable
# recipe carries its own plan and `build_engine` trains for that, while
# `training.plan.epochs` changes no identifier and no effort. Writing only the
# latter would look like a pin and be inert.
[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 1000
"training.seeds" = 2

[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 1000
"training.seeds" = 2

# The wiring check. `smoke` truncates a swept axis to two points and stamps
# `axis_subset = true`, which `mbl analyse` then refuses -- so a smoke run
# proves this document parses, resolves and trains, and nothing more.
[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
