# ICASSP -- Figure 1's GRU learning rate, ablated AT THE BATCH FIGURE 1 USES.
#
# WHAT FORCED THIS DOCUMENT, and it is a gap rather than a defect. The rate
# probe beside it (`gru_lr_probe.toml`) swept 0.001 / 0.003 / 0.01 / 0.03 / 0.1
# and read 11.93 / 11.69 / 8.3010 / 8.3133 / 16.13, choosing 0.01 -- but it ran
# at `publication`, batch 8192, and it has no `publication_b16k` overlay at all.
# Figure 1 trains at batch 16384 with lr = 0.02. That rate is therefore NOT a
# point in its own ablation's grid, and the grid was not measured at the batch
# the figure uses. Both halves matter: this campaign's standing rule is that a
# quantity chosen at one tier does not transfer to another, and the COCP rate
# probe states the same rule for the same reason -- "a rate chosen at batch 8192
# and then applied at 16384 is a rate chosen at a budget the paper does not
# use".
#
# THIS IS NOT THE n = 100 CORRECTION TRANSPLANTED. The n = 100 plant needed
# lr 0.001 and 500 epochs because at 0.02 its optimiser left its basin within
# five epochs; NOTHING about that transfers here and it is not being applied
# here. On this plant the incumbent is measured HEALTHY -- across every stored
# n = 4 arm at width 64 and rate 0.02, zero of five seeds diverge, the median
# best-loss epoch is 97 of 100, and the final loss is within 0.9 % of the
# minimum. The instance-size transfer that failed at n = 100 would fail exactly
# as badly in this direction, so what is asked here is the same QUESTION, asked
# again on this plant at its own batch, and not the same ANSWER.
#
# THE GRID BRACKETS THE INCUMBENT ON BOTH SIDES: 0.003, 0.01, 0.02, 0.03, 0.05.
# It carries the 8192 probe's winner (0.01), the rate Figure 1 actually declares
# (0.02), and one point above the pair 0.03/0.05 that the n = 4 record already
# describes as breaking down -- 0.03 broke one seed and 0.05 diverged outright
# at the smaller batch. Whether a larger batch moves that edge is the second
# thing this document measures: a bigger batch is a lower-variance gradient and
# usually tolerates a larger step, so the incumbent may be vindicated by the
# very tier that left it undocumented.
#
# THE INCUMBENT ARM IS FREE. Width 64 at lr 0.02, batch 16384, 100 epochs is
# exactly Figure 1's GRU and exactly the n = 4 width ablation's 64 point, so
# those five seeds resolve to existing ModelIDs and are reused rather than
# refitted -- "would train 20, reused 5" is the arithmetic to check before this
# runs, and it is also what makes the middle column of the table the drawn
# figure's own column rather than a re-measurement of it.
#
# WHAT HAPPENS NEXT DEPENDS ON THE ANSWER. If 0.02 wins or ties, Figure 1 stands
# as drawn and the width ablation beside it -- which fixed lr 0.02 and swept
# 16/32/64/128/256 at this same batch -- keeps its meaning; the only open item
# is then the author's 64-versus-128 choice, where the two tie in the mean
# (8.2892 against 8.2896) and 128's across-seed spread is 2.4x tighter. If some
# other rate wins, the width must be re-ablated at it before Figure 1's GRU
# column is retrained, in that order, for the reason the n = 100 sequence
# established: a capacity curve measured under a mistuned optimiser measures the
# optimiser.
#
# COST: CPU, because §2.5 measured CUDA 1.63x slower than the CPU on this
# family at n = 4. Twenty trainings at roughly 5-8 minutes each is about three
# hours, and it runs beside the GPU work rather than after it.

id = "icassp/gru_lr_probe_b16k"

# D19: the frozen plant, committed beside the study, the same one Figure 1 and
# the width ablation use. Comparing this probe with Figure 1's GRU requires the
# plant to be identical, not merely similar.
[problem]
path = "icassp_n4m2_N100_u0p1_s0.npz"

[compute]
backend = "torch"
device = "cpu"
precision = "float64"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 100

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------

# The GRU at the width the ablation chose, so that the only thing this document
# varies is the rate. `label` stays "neural": renaming it is not
# presentation-neutral, since an unregistered label falls through to a spare
# palette slot.
#
# `learning_rate` is declared here and REPLACED at every point by the sweep.
# The value written is the axis's first, so a document whose declared rate
# names one it no longer tests cannot mislead on sight.
[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 64
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.001
epochs = 100

# The number the GRU has to beat to be worth its parameters, at every rate.
# Rate-invariant, so it draws as one level and gives the sweep something to be
# read against -- and it is the contender the width ablation found the small
# widths failing to beat at all.
[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

# The unconstrained floor: not a competitor, and `role = "reference"` gives it
# §B.3.1's reserved encoding rather than a palette slot.
[[contenders]]
label = "riccati_unconstrained"
display = 'Riccati (unconstrained)'
family = "riccati"
role = "reference"

[contenders.config]
horizon = 100

# -- what varies -----------------------------------------------------------

# `applies_to` is load-bearing: without it the two rate-invariant contenders
# would each be emitted once per rate, for five identical results apiece.
[[sweep]]
path = "contenders.*.config.plan.optimizer.learning_rate"
values = [0.003, 0.01, 0.02, 0.03, 0.05]
applies_to = ["neural"]

# -- what must hold --------------------------------------------------------

[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

# -- what is computed from the results -------------------------------------

[[analyses]]
id = "cost_by_learning_rate_b16k"
kind = "cost_vs_axis"
axis = "contenders.*.config.plan.optimizer.learning_rate"
aggregate = "mean"

[[figures]]
id = "gru_lr_probe_cost_b16k"
kind = "axis_scaling"
source = "cost_by_learning_rate_b16k"
xlabel = "Adam learning rate"
ylabel = "expected cost"
title = "The recurrent baseline against its learning rate at batch 16384"
xscale = "log"

[figures.table]
columns = [
    "contender",
    "axis_value",
    "aggregate",
    "across_seed_spread",
    "n_seeds",
    "per_seed_aggregate",
]
caption = "Mean cost by Adam learning rate at batch 16384, GRU with 64 hidden units, n = 4."

[figures.table.precision]
default = 4
n_seeds = 0

# -- per-study tier overlay ------------------------------------------------

# THE PIN. `[publication]` writes `epochs = 200` while this campaign's declared
# instance is 100, and an unpinned run costs twice what it should AND produces
# a GRU that cannot be compared with Figure 1's.
[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 100

# The pin that matters here: this document exists to be run at b16k, and
# `[publication_b16k]` writes `epochs = 200` exactly as `[publication]` does.
[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 100

[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
