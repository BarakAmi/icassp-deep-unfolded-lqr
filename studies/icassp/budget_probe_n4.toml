# ICASSP -- is anything in Figure 1 still improving when its 100 epochs run out?
#
# THE QUESTION, and it is the last one the campaign has not asked of the small
# instance. Section 5.1 of the methodology establishes, on the large plant,
# that A CAPACITY VERDICT TAKEN UNDER A TRUNCATED BUDGET IS NOT A CAPACITY
# VERDICT. The same sentence indicts every rate this campaign selected at
# n = 4, because all of them were selected at 100 epochs, and nobody has ever
# measured whether 100 is enough here.
#
# IT IS ALREADY KNOWN NOT TO BE, FOR ONE FAMILY. The store holds five GRU
# models trained for 200 epochs -- the accidental overshoot of 2026-08-09, when
# a per-study overlay bound to a tier name and a new tier escaped it. At the
# same rate, 100 epochs reads 8.3036 +- 0.0178 and 200 reads 8.2766 +- 0.0016.
# DOUBLING THE BUDGET MOVES THE BASELINE BY 0.027, which is 1.5x the entire
# margin Figure 1 reports over it (8.2892 - 8.2716 = 0.0176). A defect found by
# an accident is still a defect.
#
# AND THE PROPOSED METHOD IS NOT EXEMPT. UF-alpha's own TRAINING loss is
# minimised at J = 4 (8.845560) and worse at every deeper J (8.848063 at
# J = 5); its evaluated cost rises by +0.003915 +- 0.000089 from J = 4 to
# J = 10, consistent across all five seeds. UF-alphaP(j) rises by
# +0.000458 +- 0.000057 and ends 0.000935 worse on its own training objective
# than a point it can represent exactly -- set its ten matrices equal and it IS
# UF-alphaP. Both are optimiser failures at a fixed budget, not modelling ones,
# and both are candidates for more epochs.
#
# 200 AND NOT 500, the author's ruling: 500 is over-kill given what the values
# already show, and the retrain it would imply costs 57 h against 23 h.
#
# J = 10 ONLY, and that is the design rather than a saving. The deepest unroll
# is the hardest case for the optimiser, one budget must serve the whole figure
# (Section 5.2: within a figure the budget is identical for every learned
# family), so the question is answered where it bites hardest. If J = 10 has
# converged at 100 epochs, no shallower depth can have failed to.
#
# COCP GETS ONE SEED, and that is the screen rather than the answer. It is 2/3
# of every retrain estimate at any budget (24.593 s per epoch against the GRU's
# 3.017 and the unfolded families' 0.915), so what is wanted first is whether
# the expensive family moves AT ALL, before anything commits to five seeds
# across two figures. Its across-seed spread is 0.0003, so one seed is not the
# reckless choice it would be on a family with a bimodal fit.
#
# NOTHING HERE IS THROWN AWAY. Every effective field below is Figure 1's, so
# these models carry the ModelIDs the full retrain would need: if 200 is
# adopted, `mbl run` reports them as REUSED and this probe turns out to have
# been the retrain's first instalment. That is why it runs on CPU/float64 --
# the substrate the figure publishes -- rather than on the card, where the
# campaign measured CUDA at 1.63x SLOWER on this hot loop (908.1 ms/step
# against 556.6) because a 100-step x J = 10 loop over 4x4 matrices is
# kernel-launch bound, and where float32 would perturb the unfolded families by
# the same order as the effect being measured.
#
# WHY THE BUDGET CANNOT BE READ OFF A TRAINING CURVE HERE. Section 5.1 read one
# at n = 100, licensed by the per-seed training losses agreeing with the
# evaluated costs to 0.3 %. That licence does not transfer: at n = 4 the
# training loss swings ~1.2 % epoch to epoch (seed 0's GRU: best 8.2121, final
# 8.3123) against a margin of 0.2 % that this figure argues about. The
# intermediate budget must therefore be TRAINED and EVALUATED, which is what
# this document does, rather than extrapolated from a curve whose noise exceeds
# the signal.

id = "icassp/budget_probe_n4"

# D19: Figure 1's frozen plant. The comparison is only meaningful against
# Figure 1's own 100-epoch column, so the plant must be identical rather than
# similar -- and identity is also what makes the models reusable.
[problem]
path = "icassp_n4m2_N100_u0p1_s0.npz"

# Figure 1's substrate, for the reuse reason above and the two measured ones.
[compute]
backend = "torch"
device = "cpu"
precision = "float64"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 200

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------
#
# Figure 1's five learned contenders at J = 10, declared field for field as
# Figure 1 declares them, with `epochs` at 200 instead of 100. Anything else
# that differed would mint a new ModelID and forfeit the reuse.

# A(i): learned per-iteration step size, true Riccati P. The family whose
# evaluated cost rises most with depth (+0.0039 from J = 4 to J = 10).
[[contenders]]
label = "unfolded_alpha"
display = 'UF-$\alpha$ (learned steps)'
family = "unfolded"

[contenders.config]
kind = "learned_step_size"
num_iterations = 10
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 200

# A(iii), THE PROPOSED CONTROLLER. The one family whose cost FALLS with depth
# (-0.000228 +- 0.000025 from J = 4 to J = 10) and whose training loss is
# monotone -- so the expectation here is that 200 buys it nothing, and that
# expectation is worth being able to fail.
[[contenders]]
label = "unfolded_alpha_p"
display = 'UF-$\alpha$P (proposed)'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_matrix"
num_iterations = 10
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 200

# A(ii): J independent matrices, one per iteration. Ten times the matrix
# parameters at the same rate and budget, and measured 42 % dispersed rather
# than collapsed onto the shared solution it could represent exactly. If a
# budget closes that gap, this is the arm that shows it.
[[contenders]]
label = "unfolded_alpha_pj"
display = 'UF-$\alpha$P$^{(j)}$ (per-iteration P)'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_per_iteration_matrix"
num_iterations = 10
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 200

# The recurrent baseline at the width and rate its own ablations chose. The arm
# the accidental 200-epoch models already implicate.
[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 64
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.02
epochs = 200

# THE CONVEX POLICY IS NOT HERE, and the reason is that seeds are declared per
# STUDY and not per contender. It needs one seed where these four need five, so
# forcing it into this document would either buy four COCP seeds nobody asked
# for (+5.5 h) or cut the other families to one seed, which the width
# ablation's bimodal finding makes unsafe. It runs as
# `budget_probe_n4_cocp.toml`, same fields, `training.seeds` pinned to 1.

# The two references, so the probe's table can be read on its own without
# reaching across to another study's numbers. Both are budget-invariant and
# already stored, so they cost nothing and reuse by identity.
[[contenders]]
label = "truncated_riccati"
display = 'Truncated-Riccati'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

[[contenders]]
label = "riccati_unconstrained"
display = 'Riccati (unconstrained)'
family = "riccati"
role = "reference"

[contenders.config]
horizon = 100

# -- what varies -----------------------------------------------------------

# THE BUDGET IS THE AXIS, and it is swept INSIDE this document rather than
# compared across two of them. The first draft declared no sweep and a
# `cost_vs_axis` over `epochs` anyway -- a contradiction with its own comment,
# which `mbl analyse` refused by name ("axis ... is not swept by study ...;
# declared axes: (none)") after all twenty trainings had already been paid for.
# The refusal is the mechanism working: an analysis whose axis nothing varies
# would otherwise have reduced six contenders into one group and called the
# spread across FAMILIES an error bar.
#
# THE 100-EPOCH ARM COSTS NOTHING. Every effective field here is Figure 1's, so
# those points resolve to Figure 1's own J = 10 ModelIDs and are reused rather
# than retrained -- which is also what makes the comparison exact: the drawn
# figure's models ARE this probe's control column, not a re-measurement of it.
#
# `applies_to` names the four learned families: the two references carry no
# `plan`, so a budget axis fanned over them would emit each one twice for two
# identical results.
[[sweep]]
path = "contenders.*.config.plan.epochs"
values = [100, 200]
applies_to = ["unfolded_alpha", "unfolded_alpha_p", "unfolded_alpha_pj", "neural"]

# -- what must hold --------------------------------------------------------

# Figure 1's gates, both of them, because a probe whose instance had drifted
# from the figure's would answer about a different problem. The step gate is
# declared over the three steppers this document carries; Standard-PGD is not
# among them, since it never trains and a budget cannot reach it.
[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

[[gates]]
kind = "step_is_inverse_lipschitz"
fraction = 0.5
contenders = ["unfolded_alpha", "unfolded_alpha_p", "unfolded_alpha_pj"]

# -- what is computed from the results -------------------------------------

[[analyses]]
id = "cost_at_200_epochs"
kind = "cost_vs_axis"
axis = "contenders.*.config.plan.epochs"
aggregate = "mean"

[[figures]]
id = "fig_budget_probe_n4"
kind = "axis_scaling"
source = "cost_at_200_epochs"
xlabel = "training epochs"
ylabel = "expected cost"
title = "Figure 1's cast at twice its budget"

[figures.table]
columns = [
    "contender",
    "axis_value",
    "aggregate",
    "across_seed_spread",
    "n_seeds",
    "per_seed_aggregate",
]
caption = "Mean cost at 200 epochs, J = 10, against Figure 1's 100-epoch column."

[figures.table.precision]
default = 4
axis_value = 0
n_seeds = 0

# -- per-study tier overlay ------------------------------------------------

# THE PIN, bound to the tier NAME -- the overlay-escape lesson of 2026-08-09,
# which is also the accident that produced the 200-epoch GRU this probe exists
# to follow up. `publication_b16k` writes 200 of its own accord; it is written
# here anyway, because a budget this document is ABOUT may not be inherited
# silently from a catalogue that could change.
[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 200

[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 200

[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
