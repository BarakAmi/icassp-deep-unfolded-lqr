# ICASSP Figure 2, the sweep's BLIND condition: trained on the nominal plant,
# scored on the theta-rotated one, and NOT told.
#
# The zero-shot column, and the one the three-bar figure never had. Without it
# "being told hurt the controller" cannot be separated from "the plant
# changed": at 30 degrees the proposed controller pays +26.4 % when informed,
# and until this document runs nobody can say how much of that is the rotation
# and how much is a learned cost-to-go re-forming gains in a basis it was
# never fitted for.
#
# Trains nothing, and rebuilds nothing: `rehost` stays at its default, so the
# controller is exactly the artifact Figure 1 stored and only the world under
# it moves. That also means this document declares NO per-plant construction
# literals -- there is no re-synthesis to give them to, and the analytic PGD
# keeps the nominal plant's step on every angle, which is precisely what
# "blind" means for it.
#
# THETA = 0 IS THE SAME MEASUREMENT AS FIGURE 1'S MATCHED CELL, not a copy of
# it: blind is the default, so the first position signs identically and the
# store answers it without computing anything.

id = "icassp/fig2_angle_blind"


[problem]
path = "icassp_n4m2_N100_u0p1_s0.npz"

[compute]
backend = "torch"
device = "cpu"
precision = "float64"

[training]
seeds = [0]

[training.data]
kind = "gaussian"
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

[training.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 100

[training.batch]
effective_size = 8192

[evaluation]
metrics = ["expected_cost"]

[evaluation.protocol]
_build = "protocol"
n_batches = 8

[evaluation.protocol.batch_spec]
_build = "gaussian"
batch_size = 4096
seed = 0
process_noise_std = 0.5
initial_state_std = 0.5

# -- the contenders --------------------------------------------------------
#
# Figure 1's cast at J = 3, bit for bit: one edited field would retrain rather
# than reuse, and this document exists precisely to train nothing.

[[contenders]]
label = "truncated_riccati"
display = 'Clipped-LQR'
family = "truncated_riccati"
role = "baseline"

[contenders.config]
horizon = 100

[[contenders]]
label = "standard_pgd"
display = 'PGD'
family = "unfolded_fixed"
role = "baseline"

[contenders.config]
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[[contenders]]
label = "unfolded_alpha"
display = 'UF-$\alpha$'
family = "unfolded"

[contenders.config]
kind = "learned_step_size"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "unfolded_alpha_p"
display = 'UF-$\alpha$P'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_matrix"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "unfolded_alpha_pj"
display = 'UF-$\alpha$P$^{(j)}$'
family = "unfolded"

[contenders.config]
kind = "learned_step_size_and_per_iteration_matrix"
num_iterations = 3
step_size_init = 0.028513775485296815
step_size_max = 1.0
horizon = 100
init_method = "cold"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.05
epochs = 100

[[contenders]]
label = "neural"
display = 'GRU'
family = "neural"

[contenders.config]
hidden_dim = 64
model_type = "GRU"

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.01
epochs = 100

[[contenders]]
label = "cocp"
display = 'COCP'
family = "cocp"

[contenders.config]
solver_backend = "MOREAU"
solver_device = "cpu"
solver_eps = 1e-8
solver_max_iters = 10000

[contenders.config.plan]
_build = "end_to_end"
optimizer = "adam"
learning_rate = 0.1
epochs = 100

# -- what varies -----------------------------------------------------------
#
# One axis: which plant the world runs. No training world is declared, so
# every learned point is the nominally-trained model at every angle.

[[sweep]]
path = "evaluation.problem"
values = [
    "icassp_n4m2_N100_u0p1_s0.npz",
    "icassp_n4m2_N100_u0p1_s0_rotA5.npz",
    "icassp_n4m2_N100_u0p1_s0_rotA10.npz",
    "icassp_n4m2_N100_u0p1_s0_rotA20.npz",
    "icassp_n4m2_N100_u0p1_s0_rotA30.npz",
    "icassp_n4m2_N100_u0p1_s0_rotA45.npz",
]
labels = ["0", "5", "10", "20", "30", "45"]

# -- what must hold --------------------------------------------------------

[[gates]]
kind = "constraint_binds"
min_fraction = 0.01

[[gates]]
kind = "step_is_inverse_lipschitz"
contenders = ["standard_pgd", "unfolded_alpha", "unfolded_alpha_p", "unfolded_alpha_pj"]
fraction = 0.5

# -- what is computed from the results -------------------------------------

[[analyses]]
id = "cost_by_angle_blind"
kind = "cost_by_category"
axis = "evaluation.problem"
aggregate = "mean"

# -- per-study tier overlay ------------------------------------------------

[tier_overrides.publication]
"contenders.*.config.plan.epochs" = 100
"contenders.neural.config.plan.epochs" = 200
"contenders.unfolded_alpha.config.plan.epochs" = 200
"contenders.unfolded_alpha_p.config.plan.epochs" = 200
"contenders.unfolded_alpha_pj.config.plan.epochs" = 200

[tier_overrides.publication_b16k]
"contenders.*.config.plan.epochs" = 100
"contenders.neural.config.plan.epochs" = 200
"contenders.unfolded_alpha.config.plan.epochs" = 200
"contenders.unfolded_alpha_p.config.plan.epochs" = 200
"contenders.unfolded_alpha_pj.config.plan.epochs" = 200

[tier_overrides.smoke]
"contenders.*.config.plan.epochs" = 3
